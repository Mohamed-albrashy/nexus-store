<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus POS - تسجيل الدخول الآمن للنظام</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div style="background: var(--card-bg); border: 1px solid var(--border-color); padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3);">
        <div style="font-size: 35px; margin-bottom: 5px;">💠</div>
        <h2 style="color: var(--primary-gold); font-size: 22px; font-weight: bold;">Nexus POS Enterprise</h2>
        <p style="color: var(--text-muted); font-size: 11px; margin-bottom: 20px;">نظام الإدارة وصلاحيات الموظفين والمدير</p>

        <div style="text-align: right; margin-bottom: 12px;">
            <label style="font-size: 12px; font-weight: 600; display: block; margin-bottom: 4px;">اسم المستخدم</label>
            <input type="text" id="loginUser" placeholder="محمد" style="width: 100%; padding: 9px; background: rgba(255,255,255,0.03); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 6px; font-size: 13px;">
        </div>
        <div style="text-align: right; margin-bottom: 15px;">
            <label style="font-size: 12px; font-weight: 600; display: block; margin-bottom: 4px;">كلمة المرور</label>
            <input type="password" id="loginPass" placeholder="••••••" style="width: 100%; padding: 9px; background: rgba(255,255,255,0.03); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 6px; font-size: 13px;">
        </div>
        <button id="loginBtn" style="width: 100%; padding: 10px; background: linear-gradient(135deg, #d4af37, #aa820a); border: none; border-radius: 6px; color: #fff; font-weight: bold; font-size: 14px; cursor: pointer;">
            تسجيل الدخول الآمن 🚀
        </button>
        <div style="margin-top: 15px; font-size: 11px;">
            <a href="store.html" style="color: var(--primary-gold); text-decoration: none;">🛒 الذهاب إلى متجر الزبائن أونلاين</a>
        </div>
    </div>
    <script src="pos.js"></script>
</body>
</html>
